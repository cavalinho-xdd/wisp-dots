# wisp-shell itself is not a pacman/AUR package -- install.sh bootstraps it
# separately (git clone + its own ./setup install) since it isn't published.
packages = []
post_install = [
    "wisp start >/dev/null",
]
post_update = ["wisp stop; sleep 1; wisp start >/dev/null"]

# --- Core components ---

[[components]]
name = "hypr"
default = true
packages = [
    "hyprland",
    "xdg-desktop-portal-hyprland",
    "xdg-desktop-portal-gtk",
    "ttf-jetbrains-mono-nerd",
    "ttf-mona-sans",
    "noto-fonts-emoji", # emoji in Zen, Vesktop, kitty -- boxes without it
    "noto-fonts-cjk",
    "nwg-displays",     # monitor layout GUI; writes hypr/monitors.lua
]
post_install = [
    "touch ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/local.lua",
    "test -f ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/keybinds_custom.lua || printf '%s\\n%s\\n' '-- Wisp custom keybinds -- managed entirely by Settings > Keybinds > Add keybind.' '-- Hand edits here will be overwritten the next time a keybind is added, edited, or removed.' > ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/keybinds_custom.lua",
    "hyprctl reload >/dev/null",
]
post_update = ["hyprctl reload >/dev/null"]
[[components.entries]]
src = "hypr"
dest = "$XDG_CONFIG_HOME/hypr"
# wisp-shell runs hooks/material when the island material changes
[[components.entries]]
src = "wisp/hooks"
dest = "$XDG_CONFIG_HOME/wisp/hooks"

[[components]]
name = "audio"
default = true
# hypr/keybinds.lua binds hardware volume/mic keys to wpctl (wireplumber),
# and core/Audio.qml (wisp-shell) binds live to Quickshell.Services.Pipewire's
# Pipewire.defaultAudioSink/Source -- both need a real running PipeWire +
# WirePlumber session, not just Quickshell's libpipewire client link.
packages = ["pipewire", "pipewire-pulse", "pipewire-audio", "pipewire-alsa", "wireplumber", "pwvucontrol"]

[[components]]
name = "apps"
default = true
# Everyday desktop apps, Qt/KDE so they share the qtengine theme.
packages = ["kate", "gwenview", "okular", "ark", "unzip", "7zip", "mpv", "kcalc"]

[[components]]
name = "power"
default = true
# Power saver / balanced / performance profiles (powerprofilesctl, D-Bus).
# Enabled explicitly: Arch ships no preset for it. start fails harmlessly in a chroot.
packages = ["power-profiles-daemon"]
post_install = [
    "sudo systemctl enable power-profiles-daemon.service && { sudo systemctl start power-profiles-daemon.service 2>/dev/null || true; }",
]

[[components]]
name = "filemanager"
default = true
# hypr/keybinds.lua binds SUPER+E to dolphin (also the README's documented
# out-of-box file manager keybind). qt-theme themes it but never installed it.
packages = ["dolphin", "kio-extras", "ffmpegthumbs", "kdegraphics-thumbnailers"]  # + image/video/PDF previews

[[components]]
name = "gtk-theme"
default = true
# install.sh's gsettings step sets gtk-theme=adw-gtk3-dark,
# icon-theme=Papirus-Dark, cursor-theme=Bibata-Modern-Classic; env.lua sets
# XCURSOR_THEME=Bibata-Modern-Classic and hyprland.lua runs
# `hyprctl setcursor Bibata-Modern-Classic` on start -- none of these named
# themes were ever installed as packages.
packages = ["adw-gtk-theme", "papirus-icon-theme", "bibata-cursor-theme-bin"]

[[components]]
name = "matugen"
default = true
packages = ["matugen"]  # in extra; an installed matugen-bin also satisfies it
[[components.entries]]
src = "matugen"
dest = "$XDG_CONFIG_HOME/matugen"

[[components]]
name = "qt-theme"
default = true
# Themes Qt/KDE apps (Dolphin, etc). Primary: qtengine, reads the
# kde_colorscheme matugen template (a real KDE .colors scheme -- what
# KColorScheme widgets like Dolphin's file view actually read, unlike a
# plain QPalette). Fallback: qt5ct/qt6ct via the matugen templates in the
# matugen component above; their .conf files aren't shipped as static
# dotfiles since they need a real absolute $HOME baked in -- install.sh's
# "Qt platform theme" step generates them.
# breeze5/kvantum-qt5/qt5-wayland: the Qt5 halves, so Qt5 apps get the same
# style and run natively on Wayland like Qt6 ones (qt6-wayland).
packages = ["qtengine", "breeze", "breeze5", "qt5ct", "qt6ct", "kvantum", "kvantum-qt5", "qt5-wayland", "qt6-wayland"]
[[components.entries]]
src = "qtengine"
dest = "$XDG_CONFIG_HOME/qtengine"

[[components]]
name = "fish"
default = true
packages = ["fish", "eza", "zoxide", "direnv", "starship"]
post_install = [
    "mkdir -p ${XDG_CONFIG_HOME:-$HOME/.config}/wisp-dots",
    "touch ${XDG_CONFIG_HOME:-$HOME/.config}/wisp-dots/user-config.fish",
]
[[components.entries]]
src = "fish"
dest = "$XDG_CONFIG_HOME/fish"

[[components]]
name = "kitty"
default = true
packages = ["kitty", "otf-monaspace"]
[[components.entries]]
src = "kitty"
dest = "$XDG_CONFIG_HOME/kitty"

[[components]]
name = "fastfetch"
default = true
packages = ["fastfetch"]
[[components.entries]]
src = "fastfetch"
dest = "$XDG_CONFIG_HOME/fastfetch"

[[components]]
name = "btop"
default = true
packages = ["btop"]
post_install = ["killall -USR2 btop 2>/dev/null || true"]
post_update = ["killall -USR2 btop 2>/dev/null || true"]
[[components.entries]]
src = "btop"
dest = "$XDG_CONFIG_HOME/btop"

[[components]]
name = "micro"
default = true
packages = ["micro"]
[[components.entries]]
src = "micro"
dest = "$XDG_CONFIG_HOME/micro"

[[components]]
name = "clipboard"
default = true
# hypr/hyprland.lua starts `wl-paste --watch cliphist store` on hyprland.start
packages = ["wl-clipboard", "cliphist"]

[[components]]
name = "tools"
default = true
packages = [
    "curl",
    "git",
    "jq",
    "rsync", # install.sh deploy_copy syncs every non-hypr config with it
    "lazygit",
    "bat",
    "ripgrep",
    "xdg-user-dirs",
    "brightnessctl", # hypr/keybinds.lua hardware brightness keys
]
post_install = ["xdg-user-dirs-update"]

# --- Optional components ---

[[components]]
name = "spotify"
packages = ["spotify", "spicetify-cli", "spicetify-marketplace-bin"]
post_install = [
    "spicetify config current_theme Matugen color_scheme Matugen custom_apps marketplace",
    "spicetify apply",
]
[[components.entries]]
src = "spicetify"
dest = "$XDG_CONFIG_HOME/spicetify"

[[components]]
name = "discord"
default = true
packages = ["vesktop-bin"]
# matugen renders the wisp-shell theme to vesktop/themes/matugen.css; switch it
# on in Vesktop's own settings so it's active on the first launch.
post_install = [
    "f=${XDG_CONFIG_HOME:-$HOME/.config}/vesktop/settings/settings.json; mkdir -p \"${f%/*}\"; [ -s \"$f\" ] || echo '{}' > \"$f\"; jq '.enabledThemes = ((.enabledThemes // []) - [\"matugen.css\"] + [\"matugen.css\"])' \"$f\" > \"$f.tmp\" && mv \"$f.tmp\" \"$f\"",
]

[[components]]
name = "browser"
default = true
# Zen is the one browser; firefox stays an optional component for its userChrome.
packages = ["zen-browser-bin"]
post_install = [
    "xdg-mime default zen.desktop x-scheme-handler/http x-scheme-handler/https text/html application/xhtml+xml",
]

[[components]]
name = "firefox"
# No [[components.entries]] here -- Firefox profile dirs are randomly named
# (<8 random chars>.default-release), so a static src/dest pair doesn't
# work. install.sh's dedicated Firefox step parses profiles.ini to find the
# real profile dir and deploys userChrome.css/user.js there instead.
packages = ["firefox"]
