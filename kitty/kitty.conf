# Wisp Shell - Kitty Configuration
# Ref: Wisp Ember DESIGN.md (fixed neutrals; only the ember comes from the wallpaper)

# calt = Monaspace texture healing; ss01-ss09 = code ligatures (VS Code set from the Monaspace README)
font_family      family="Monaspace Neon" features="+calt +liga +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08 +ss09"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0

window_padding_width 24

# Smoked glass by default; material.conf (end of file) follows the shell's
# island material. Hyprland does the blur.
background_opacity 0.90
hide_window_decorations yes

# Fixed palette: smoke/ash neutrals, semantic red/green/yellow from DESIGN.md
foreground #eef0f4
background #0b0c0f

color0  #15171c
color8  #5c616c
color1  #f38ba8
color9  #f7a8be
color2  #a6e3a1
color10 #bdebb9
color3  #f9e2af
color11 #fbecc8
color4  #8fa8d8
color12 #aec2e6
color5  #c3a6e8
color13 #d6c2f0
color6  #8fcfc8
color14 #b0ddd8
color7  #b8bcc6
color15 #eef0f4

active_border_color     none
inactive_tab_foreground #8a8f9b
inactive_tab_background #15171c
active_tab_background   #20232a
tab_bar_background      #0b0c0f

# Generated by Matugen: the ember (cursor, selection, links, active tab)
include colors.conf

# Written by ~/.config/wisp/hooks/material when the shell material changes
globinclude material.conf
