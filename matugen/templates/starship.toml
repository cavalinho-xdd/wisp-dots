# version: 1.0.0
# Wisp Starship Configuration

add_newline = false
palette = "wisp"

continuation_prompt = "[▸▹ ](muted)"

format = """($nix_shell$container$fill$git_metrics\n)$cmd_duration\
$hostname\
$localip\
$shlvl\
$shell\
$env_var\
$jobs\
$sudo\
$username\
$character"""

right_format = """
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$package\
$memory_usage\
$status\
$os\
$battery\
$time"""

# Wisp Ember: fixed neutrals and semantic colours, only the ember comes from the wallpaper
[palettes.wisp]
ember = "#{{colors.primary.default.hex_stripped}}"
text = "#eef0f4"
muted = "#8a8f9b"
error = "#f38ba8"
success = "#a6e3a1"
warning = "#f9e2af"

[fill]
symbol = ' '

[character]
format = "$symbol "
success_symbol = "[◎](bold ember)"
error_symbol = "[○](bold error)"
vimcmd_symbol = "[■](bold warning)"
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[sudo]
format = "[$symbol]($style)"
style = "bold italic ember"
symbol = "⋈┈"
disabled = false

[username]
style_user = "bold italic muted"
style_root = "bold italic error"
format = "[⭘ $user]($style) "
disabled = false
show_always = false

[directory]
home_symbol = "⌂"
truncation_length = 2
truncation_symbol = "□ "
read_only = " ◈"
use_os_path_sep = true
style = "italic text"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = 'bold text'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [△](bold muted)'

[cmd_duration]
min_time = 0
format = "[◄ $duration ](italic muted)"

[jobs]
format = "[$symbol$number]($style) "
style = "muted"
symbol = "[▶](muted italic)"

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic dimmed muted"

[git_branch]
format = " [$branch(:$remote_branch)]($style)"
symbol = "[△](muted)"
style = "italic muted"
truncation_symbol = "⋯"
truncation_length = 11

[git_status]
style = "bold italic muted"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic warning)"
ahead = "[▴│[${count}](bold text)│](italic warning)"
behind = "[▿│[${count}](bold text)│](italic error)"
untracked = "[◌◦](italic muted)"
modified = "[●◦](italic ember)"
staged = "[▪┤[$count](bold text)│](italic success)"
deleted = "[✕](italic error)"
